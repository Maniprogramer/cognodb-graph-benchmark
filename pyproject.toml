[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognodb-graph-benchmark"
version = "1.0.0"
description = "Reproducible benchmark of CognoDB Cloud against other managed graph databases"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  # matplotlib's mathtext parser trips deprecation warnings inside
  # pyparsing; nothing in this project can act on them.
  "ignore::DeprecationWarning",
  "ignore::UserWarning:matplotlib.*",
  "ignore:.*parseAll.*:DeprecationWarning",
  "ignore:.*resetCache.*:DeprecationWarning",
]
